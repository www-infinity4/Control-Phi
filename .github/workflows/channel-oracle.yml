name: Oracle channel verification bots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths: ['control-phi.js', 'channel-oracle*', 'channels.json']
permissions:
  contents: read
concurrency:
  group: channel-oracle
  cancel-in-progress: false
jobs:
  red-pink-black:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/star-sync.cjs
      - run: node channel-oracle-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-channel-browser-evidence
          path: channel-evidence/
          retention-days: 14
